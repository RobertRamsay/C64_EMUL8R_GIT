[package]
name = "c64emul8r"
version = "0.1.0"
description = "C64EMUL8R - Commodore 64 / C64 Ultimate emulator with built-in debugger"
authors = ["Robert Ramsay"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }
# Same versions as Tauri's wry, to reach the WebView2 settings it doesn't expose
webview2-com = "0.39"
windows-core = "0.62"

# No C++ compiler needed: see patches/vswhom/src/lib.rs
[patch.crates-io]
vswhom = { path = "patches/vswhom" }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
