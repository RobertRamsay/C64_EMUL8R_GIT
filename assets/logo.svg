<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>C64EMUL8R</title>
  <defs>
    <!-- app background: dark grey fading into Commodore blue -->
    <linearGradient id="bg" x1="0.12" y1="0" x2="0.88" y2="1">
      <stop offset="0" stop-color="#121318"/>
      <stop offset="0.38" stop-color="#191b23"/>
      <stop offset="0.72" stop-color="#1f1d3a"/>
      <stop offset="1" stop-color="#2a2266"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.6" r="0.5">
      <stop offset="0" stop-color="#6c5eb5" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#6c5eb5" stop-opacity="0"/>
    </radialGradient>

    <!-- brushed silver: bright bands with a darker horizon line -->
    <linearGradient id="silver" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.18" stop-color="#dfe3ec"/>
      <stop offset="0.42" stop-color="#9aa1b3"/>
      <stop offset="0.5" stop-color="#6f7689"/>
      <stop offset="0.56" stop-color="#c9ceda"/>
      <stop offset="0.78" stop-color="#f4f6fa"/>
      <stop offset="1" stop-color="#a7adbd"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#fff" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>

    <!-- the mark: a C opening upward, with two flags standing in its mouth -->
    <mask id="cut" maskUnits="userSpaceOnUse" x="-200" y="-200" width="912" height="912">
      <rect x="-200" y="-200" width="912" height="912" fill="#000"/>
      <g fill="#fff">
        <!-- traced from the reference: outer r153.5, hole r81 set slightly high, cut flat at y148.5 -->
        <path d="M65.4 148.5 A153.5 153.5 0 1 0 349.6 148.5 L270.1 148.5 A81 81 0 1 1 145.9 148.5 Z"/>
        <path d="M152 30 L202 74 L202 148.5 L152 148.5 Z"/>
        <path d="M265 30 L214 74 L214 148.5 L265 148.5 Z"/>
      </g>
    </mask>

    <!-- chrome bevel: lit edges plus a soft shadow under the mark -->
    <filter id="bevel" x="-10%" y="-10%" width="120%" height="125%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="blur"/>
      <feSpecularLighting in="blur" surfaceScale="5" specularConstant="1.1" specularExponent="28" lighting-color="#ffffff" result="spec">
        <fePointLight x="120" y="-160" z="320"/>
      </feSpecularLighting>
      <feComposite in="spec" in2="SourceAlpha" operator="in" result="specIn"/>
      <feComposite in="SourceGraphic" in2="specIn" operator="arithmetic" k1="0" k2="1" k3="0.75" k4="0" result="lit"/>
      <feGaussianBlur in="SourceAlpha" stdDeviation="9" result="sh"/>
      <feOffset in="sh" dy="10" result="shOff"/>
      <feFlood flood-color="#05040f" flood-opacity="0.7"/>
      <feComposite in2="shOff" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="lit"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>
  <rect x="1.5" y="1.5" width="509" height="509" rx="110.5" fill="none" stroke="#8a7ff5" stroke-opacity="0.25" stroke-width="3"/>

  <g transform="translate(256 256) scale(1.24) translate(-207.5 -195)" filter="url(#bevel)">
    <g mask="url(#cut)">
      <rect x="40" y="10" width="332" height="350" fill="url(#silver)"/>
      <rect x="-200" y="-200" width="912" height="912" fill="url(#sheen)" transform="rotate(-20 206 191)"/>
    </g>
  </g>
</svg>
